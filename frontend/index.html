<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube 相場予想集計ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.5;
      padding-bottom: 60px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 920px; margin: 0 auto; padding: 0 16px; }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-inner {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      background: #0f172a;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .brand-title { font-size: 15px; font-weight: 700; color: #0f172a; }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 18px 20px;
      margin-top: 16px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: #0f172a; }
    .card-desc { font-size: 12px; color: #64748b; margin-top: 2px; }

    .input-row { display: flex; gap: 8px; margin-top: 8px; }
    .input-text {
      flex: 1;
      padding: 9px 12px;
      font-size: 13px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
    }
    .input-text:focus { border-color: #0f172a; background: #ffffff; }

    .btn-primary {
      padding: 9px 18px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #1e293b; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-sub {
      padding: 6px 12px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sub:hover { background: #e2e8f0; }

    .sample-btn {
      font-size: 12px;
      color: #2563eb;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      font-weight: 500;
    }

    .loading-box {
      text-align: center;
      padding: 36px 0;
      display: none;
    }
    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2.5px solid #cbd5e1;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }

    /* 投稿ヘッダー */
    .post-header { display: flex; gap: 14px; align-items: flex-start; }
    .post-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
      display: none;
    }
    .post-author { font-size: 13px; font-weight: 600; color: #0f172a; }
    .post-time { font-size: 11px; color: #64748b; margin-left: 6px; }
    .post-title { font-size: 13px; font-weight: 600; color: #334155; margin-top: 2px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .badge {
      background: #f1f5f9;
      color: #475569;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    /* KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .kpi-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px 14px;
    }
    .kpi-label { font-size: 11px; color: #64748b; font-weight: 500; }
    .kpi-value { font-size: 20px; font-weight: 700; color: #0f172a; margin-top: 2px; }
    .kpi-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }

    /* 棒グラフ */
    .chart-container { margin-top: 12px; }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .bar-label { width: 130px; color: #475569; text-align: right; flex-shrink: 0; font-family: monospace; font-size: 11px; }
    .bar-track { flex: 1; background: #f1f5f9; border-radius: 3px; height: 18px; overflow: hidden; }
    .bar-fill { height: 100%; background: #334155; border-radius: 3px; }
    .bar-value { width: 75px; color: #0f172a; font-weight: 600; font-size: 11px; }

    /* 正解判定 */
    .quiz-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 14px;
      margin-top: 10px;
    }
    .input-number {
      width: 100px;
      padding: 6px 8px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      text-align: right;
    }
    .script-textarea {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      font-family: monospace;
      color: #334155;
      line-height: 1.5;
      resize: vertical;
      margin-top: 4px;
    }

    .exact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .exact-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 10px;
    }

    /* コメントテーブル */
    .table-container {
      overflow-x: auto;
      max-height: 380px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-top: 10px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th { background: #f8fafc; color: #475569; padding: 7px 10px; font-weight: 600; position: sticky; top: 0; border-bottom: 1px solid #e2e8f0; z-index: 10; }
    td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; color: #334155; }
    tr:hover { background: #f8fafc; }
    tr.row-excluded { opacity: 0.45; background: #fafafa; }
    .chk-include { cursor: pointer; transform: scale(1.1); }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-badge">STAT</span>
        <span class="brand-title">YouTube 相場予想集計</span>
      </div>
      <div style="font-size: 12px; color: #64748b;">動画制作向け統計ツール</div>
    </div>
  </header>

  <main class="container">

    <!-- URL入力 -->
    <div class="card">
      <form id="analyzeForm" onsubmit="handleFormSubmit(event)">
        <label style="font-size: 12px; font-weight: 600; color: #475569;">対象のYouTube投稿または動画のURL</label>
        <div class="input-row">
          <input
            type="text"
            id="postUrl"
            required
            placeholder="https://www.youtube.com/post/UgkxjHhnb7b_31Ry7mGWXCmVnOL--bN4czrL"
            class="input-text"
          />
          <button type="submit" id="submitBtn" class="btn-primary">
            <span id="btnText">集計を開始</span>
          </button>
        </div>
        <div style="margin-top: 6px;">
          <span style="font-size: 11px; color: #64748b;">サンプル: </span>
          <button type="button" onclick="loadSample()" class="sample-btn">
            TOMIKKU NET 海鮮丼クイズ投稿
          </button>
        </div>
      </form>
      <div id="alertBox" class="alert-error"></div>
    </div>

    <!-- ローディング（解析中のみ表示） -->
    <div id="loadingBox" class="loading-box">
      <div class="spinner"></div>
      <div style="font-size: 13px; font-weight: 600; color: #475569; margin-top: 8px;">解析中</div>
    </div>

    <!-- 結果エリア -->
    <div id="dashboardArea" style="display: none;">

      <!-- 投稿情報 -->
      <div class="card post-header">
        <img id="postImg" class="post-img" src="" alt="サムネイル" />
        <div style="flex: 1;">
          <div>
            <span id="postAuthor" class="post-author"></span>
            <span id="postTime" class="post-time"></span>
          </div>
          <div id="postTitle" class="post-title"></div>
          <div class="badges">
            <div class="badge">総コメント数: <strong id="statTotal">0</strong>件</div>
            <div class="badge">集計対象: <strong id="statIncluded" style="color: #0f172a;">0</strong>件</div>
            <div class="badge">除外・対象外: <strong id="statExcluded" style="color: #64748b;">0</strong>件</div>
          </div>
        </div>
      </div>

      <!-- 統計KPIサマリー -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">予想平均値</div>
          <div class="kpi-value"><span id="kpiMean">0</span> <span style="font-size: 12px; font-weight: normal; color: #64748b;">円</span></div>
          <div class="kpi-sub">有効な予想の平均</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">予想中央値</div>
          <div class="kpi-value"><span id="kpiMedian">0</span> <span style="font-size: 12px; font-weight: normal; color: #64748b;">円</span></div>
          <div class="kpi-sub">ちょうど中間の予想</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">最頻予想帯</div>
          <div class="kpi-value"><span id="kpiMode">0</span> <span style="font-size: 12px; font-weight: normal; color: #64748b;">円</span></div>
          <div class="kpi-sub"><span id="kpiModeCount">0</span> 名がこの帯を予想</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">予想範囲 (Min - Max)</div>
          <div class="kpi-value" style="font-size: 16px;"><span id="kpiMin">0</span> - <span id="kpiMax">0</span> <span style="font-size: 11px; font-weight: normal; color: #64748b;">円</span></div>
          <div class="kpi-sub">最小〜最大値</div>
        </div>
      </div>

      <!-- 金額分布ヒストグラム -->
      <div class="card">
        <div class="card-title">金額分布ヒストグラム</div>
        <div class="card-desc">チェックを入れた予想の価格帯分布</div>
        <div id="chartBars" class="chart-container"></div>
      </div>

      <!-- コメント一覧 -->
      <div class="card">
        <div class="card-header" style="flex-wrap: wrap; gap: 8px;">
          <div>
            <div class="card-title">コメント一覧 (<span id="commentCount">0</span> 件)</div>
            <div class="card-desc">チェックを外すと集計から除外され、統計が即時再計算されます</div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <select id="filterSelect" onchange="renderTable()" style="padding: 5px 8px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff;">
              <option value="all">すべてのコメント</option>
              <option value="included">集計対象のみ</option>
              <option value="excluded">除外・対象外のみ</option>
            </select>
            <select id="sortSelect" onchange="renderTable()" style="padding: 5px 8px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff;">
              <option value="likes">いいね数順</option>
              <option value="price_desc">金額が高い順</option>
              <option value="price_asc">金額が安い順</option>
            </select>
          </div>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width: 50px; text-align: center;">
                  <input type="checkbox" id="masterCheckbox" title="全選択/全解除" onchange="toggleAllCheckboxes(this.checked)" class="chk-include" checked />
                </th>
                <th style="width: 140px;">投稿者</th>
                <th style="width: 110px; text-align: right;">抽出金額</th>
                <th>コメント本文</th>
                <th style="width: 70px; text-align: right;">いいね数</th>
              </tr>
            </thead>
            <tbody id="commentTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 画像出力（ページ最下部） -->
      <div style="margin-top: 24px; text-align: center;">
        <button type="button" onclick="exportTransparentGraph(this)" class="btn-primary" style="padding: 12px 28px; font-size: 14px;">
          透過PNG画像（1920x1080）を出力
        </button>
        <div style="font-size: 11px; color: #64748b; margin-top: 6px;">動画編集ソフトにそのまま重ねられる高解像度テロップ画像を書き出します</div>
      </div>

    </div>

  </main>

  <script>
    let rawComments = [];
    let currentMetadata = {};
    let calculatedStats = {};
    const SAMPLE_URL = 'https://www.youtube.com/post/UgkxjHhnb7b_31Ry7mGWXCmVnOL--bN4czrL';

    function loadSample() {
      const input = document.getElementById('postUrl');
      if (input) {
        input.value = SAMPLE_URL;
        handleFormSubmit();
      }
    }

    async function handleFormSubmit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('postUrl');
      const url = input ? input.value.trim() : '';
      if (!url) return;

      const loadingBox = document.getElementById('loadingBox');
      const dashboardArea = document.getElementById('dashboardArea');
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      if (loadingBox) loadingBox.style.display = 'block';
      if (dashboardArea) dashboardArea.style.display = 'none';
      if (alertBox) alertBox.style.display = 'none';
      if (submitBtn) submitBtn.disabled = true;

      try {
        const resp = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url, max_comments: 2000 })
        });

        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          throw new Error(errData.detail || ('HTTPエラー: ' + resp.status));
        }

        const data = await resp.json();
        if (!data.success) {
          throw new Error(data.detail || '集計に失敗しました');
        }

        currentMetadata = data.metadata || {};
        // コメントに一意のIDと初期のincludedフラグ（金額があればtrue）を付与
        rawComments = (data.stats.comments || []).map((c, idx) => ({
          ...c,
          uid: 'c_' + idx,
          included: c.has_price
        }));

        renderHeader();
        recalculateAndRender();
        if (dashboardArea) dashboardArea.style.display = 'block';

      } catch (err) {
        console.error(err);
        if (alertBox) {
          alertBox.textContent = 'エラー: ' + (err.message || 'URLをご確認ください。');
          alertBox.style.display = 'block';
        }
      } finally {
        if (loadingBox) loadingBox.style.display = 'none';
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    function renderHeader() {
      setText('postAuthor', currentMetadata.author || 'YouTube チャンネル');
      setText('postTime', currentMetadata.published_time || '');
      setText('postTitle', currentMetadata.title || currentMetadata.post_text || '投稿');

      const img = document.getElementById('postImg');
      if (img) {
        if (currentMetadata.image_url) {
          img.src = currentMetadata.image_url;
          img.style.display = 'block';
        } else {
          img.style.display = 'none';
        }
      }
    }

    // クライアント側でミリ秒で全統計をリアルタイム再計算
    function recalculateAndRender() {
      const validItems = rawComments.filter(c => c.has_price && c.included);
      const prices = validItems.map(c => c.price);

      const totalCount = rawComments.length;
      const includedCount = validItems.length;
      const excludedCount = totalCount - includedCount;

      setText('statTotal', totalCount.toLocaleString());
      setText('statIncluded', includedCount.toLocaleString());
      setText('statExcluded', excludedCount.toLocaleString());

      let meanVal = 0, medianVal = 0, modeVal = 0, modeCount = 0, minVal = 0, maxVal = 0;
      let histogram = [];

      if (prices.length > 0) {
        prices.sort((a, b) => a - b);
        const sum = prices.reduce((a, b) => a + b, 0);
        meanVal = Math.round(sum / prices.length);

        const mid = Math.floor(prices.length / 2);
        medianVal = prices.length % 2 !== 0 ? prices[mid] : Math.round((prices[mid - 1] + prices[mid]) / 2);

        minVal = prices[0];
        maxVal = prices[prices.length - 1];

        // 最頻値（100円単位で丸めて集計）
        const counts = {};
        prices.forEach(p => {
          const r = Math.round(p / 100) * 100;
          counts[r] = (counts[r] || 0) + 1;
        });
        let maxC = 0;
        for (const [r, c] of Object.entries(counts)) {
          if (c > maxC) {
            maxC = c;
            modeVal = parseFloat(r);
            modeCount = c;
          }
        }

        // ヒストグラム自動分割
        const span = maxVal - minVal;
        let binSize = 500;
        if (span > 15000) binSize = 2000;
        else if (span > 5000) binSize = 1000;

        const binStart = Math.floor(minVal / binSize) * binSize;
        const binEnd = Math.floor((maxVal / binSize) + 1) * binSize;

        for (let b = binStart; b < binEnd; b += binSize) {
          const nextB = b + binSize;
          const countInBin = prices.filter(p => p >= b && (b === binEnd - binSize ? p <= nextB : p < nextB)).length;
          if (countInBin > 0 || (b >= minVal && b <= maxVal)) {
            histogram.push({
              label: b.toLocaleString() + '〜' + nextB.toLocaleString() + '円',
              range_min: b,
              range_max: nextB,
              count: countInBin,
              percentage: Math.round((countInBin / prices.length) * 1000) / 10
            });
          }
        }
      }

      calculatedStats = {
        mean_price: meanVal,
        median_price: medianVal,
        mode_price: modeVal,
        mode_count: modeCount,
        min_price: minVal,
        max_price: maxVal,
        included_count: includedCount,
        histogram: histogram
      };

      setText('kpiMean', meanVal.toLocaleString());
      setText('kpiMedian', medianVal.toLocaleString());
      setText('kpiMode', modeVal.toLocaleString());
      setText('kpiModeCount', modeCount.toLocaleString());
      setText('kpiMin', minVal.toLocaleString());
      setText('kpiMax', maxVal.toLocaleString());

      renderBars(histogram);
      renderTable();

      const priceInput = document.getElementById('correctPriceInput');
      if (priceInput && (!priceInput.value || parseFloat(priceInput.value) <= 0)) {
        priceInput.value = medianVal || meanVal || '';
      }
      const currentQuizVal = parseFloat(priceInput ? priceInput.value : 0);
      if (currentQuizVal > 0) {
        recomputeQuiz(currentQuizVal);
      }
    }

    function renderBars(histogram) {
      const container = document.getElementById('chartBars');
      if (!container) return;
      container.innerHTML = '';

      if (!histogram || histogram.length === 0) {
        container.innerHTML = '<div style="font-size: 11px; color: #94a3b8; padding: 10px 0;">データがありません（チェックを入れてください）</div>';
        return;
      }

      const maxCount = Math.max(...histogram.map(h => h.count), 1);

      histogram.forEach(item => {
        const pct = item.percentage || 0;
        const widthPct = Math.round((item.count / maxCount) * 100);

        const row = document.createElement('div');
        row.className = 'bar-row';
        row.innerHTML = `
          <div class="bar-label">${escapeHtml(item.label)}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width: ${widthPct}%;"></div>
          </div>
          <div class="bar-value">${item.count}名 (${pct}%)</div>
        `;
        container.appendChild(row);
      });
    }

    function renderTable() {
      const tbody = document.getElementById('commentTbody');
      if (!tbody) return;
      tbody.innerHTML = '';

      const filterType = getVal('filterSelect') || 'all';
      const sortBy = getVal('sortSelect') || 'likes';

      let filtered = [...rawComments];
      if (filterType === 'included') {
        filtered = filtered.filter(c => c.has_price && c.included);
      } else if (filterType === 'excluded') {
        filtered = filtered.filter(c => !c.has_price || !c.included);
      }

      setText('commentCount', filtered.length);

      if (sortBy === 'likes') {
        filtered.sort((a, b) => (b.like_count || 0) - (a.like_count || 0));
      } else if (sortBy === 'price_desc') {
        filtered.sort((a, b) => ((b.price || 0) - (a.price || 0)));
      } else if (sortBy === 'price_asc') {
        filtered.sort((a, b) => ((a.price || 0) - (b.price || 0)));
      }

      if (filtered.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">該当するコメントはありません</td>';
        tbody.appendChild(tr);
        return;
      }

      filtered.forEach(c => {
        const tr = document.createElement('tr');
        if (!c.included || !c.has_price) {
          tr.className = 'row-excluded';
        }

        let priceText = '-';
        let priceStyle = 'color: #94a3b8;';
        if (c.has_price) {
          if (c.is_range && c.range_low && c.range_high) {
            priceText = c.range_low.toLocaleString() + '〜' + c.range_high.toLocaleString() + '円';
          } else {
            priceText = (c.price || 0).toLocaleString() + '円';
          }
          priceStyle = c.included ? 'color: #0f172a; font-weight: 700;' : 'color: #94a3b8; text-decoration: line-through;';
        }

        const chkDisabled = !c.has_price ? 'disabled' : '';
        const chkChecked = (c.has_price && c.included) ? 'checked' : '';

        tr.innerHTML = `
          <td style="text-align: center;">
            <input type="checkbox" class="chk-include" ${chkDisabled} ${chkChecked} onchange="toggleCommentInclusion('${c.uid}', this.checked)" />
          </td>
          <td style="font-weight: 600; color: #0f172a;">${escapeHtml(c.author || '匿名')}</td>
          <td style="text-align: right; ${priceStyle}">${priceText}</td>
          <td>${escapeHtml(c.text || '')}</td>
          <td style="text-align: right; color: #64748b;">${c.like_count || 0}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleCommentInclusion(uid, isChecked) {
      const item = rawComments.find(c => c.uid === uid);
      if (item) {
        item.included = isChecked;
        recalculateAndRender();
      }
    }

    function toggleAllCheckboxes(isChecked) {
      rawComments.forEach(c => {
        if (c.has_price) {
          c.included = isChecked;
        }
      });
      recalculateAndRender();
    }

    function applyQuiz() {
      const val = parseFloat(getVal('correctPriceInput'));
      if (!isNaN(val) && val > 0) {
        recomputeQuiz(val);
      }
    }

    function recomputeQuiz(correctPrice) {
      const valid = rawComments.filter(c => c.has_price && c.included);
      const meanVal = calculatedStats.mean_price || 0;

      const exact = [];
      const near = [];
      const nearMargin = Math.max(300, correctPrice * 0.10);

      valid.forEach(item => {
        const p = item.price || 0;
        const diff = p - correctPrice;
        const absDiff = Math.abs(diff);
        if (absDiff === 0 || (item.is_range && item.range_low <= correctPrice && correctPrice <= item.range_high)) {
          exact.push(item);
        } else if (absDiff <= nearMargin) {
          near.push({ ...item, diff, abs_diff: absDiff });
        }
      });

      near.sort((a, b) => a.abs_diff - b.abs_diff);
      const diffFromMean = correctPrice - meanVal;

      setText('exactCount', exact.length);
      setText('nearCount', near.length);

      const gapElem = document.getElementById('gapText');
      if (gapElem) {
        if (diffFromMean > 0) {
          gapElem.textContent = '+' + Math.round(diffFromMean).toLocaleString() + ' 円';
          gapElem.style.color = '#d97706';
        } else if (diffFromMean < 0) {
          gapElem.textContent = Math.round(diffFromMean).toLocaleString() + ' 円';
          gapElem.style.color = '#2563eb';
        } else {
          gapElem.textContent = '0 円';
          gapElem.style.color = '#16a34a';
        }
      }

      const scriptText = [
        '正解金額: ' + correctPrice.toLocaleString() + '円',
        '総予想回答数: ' + valid.length + '件',
        '視聴者の予想平均: ' + meanVal.toLocaleString() + '円 (中央値: ' + (calculatedStats.median_price || 0).toLocaleString() + '円)',
        '最頻予想帯: ' + (calculatedStats.mode_price || 0).toLocaleString() + '円前後 (' + (calculatedStats.mode_count || 0) + '名)',
        '正解者: ' + exact.length + '名'
      ].join('\n');

      const scriptArea = document.getElementById('scriptArea');
      if (scriptArea) scriptArea.value = scriptText;

      const exactList = document.getElementById('exactList');
      if (exactList) {
        exactList.innerHTML = '';
        if (exact.length === 0) {
          exactList.innerHTML = '<div style="font-size: 11px; color: #94a3b8; padding: 4px 0;">正解者はいませんでした</div>';
        } else {
          exact.forEach(item => {
            let priceDisplay = '';
            let badgeText = '';
            if (item.is_range && item.range_low && item.range_high) {
              priceDisplay = item.range_low.toLocaleString() + '〜' + item.range_high.toLocaleString() + '円';
              badgeText = '<span style="font-size: 10px; font-weight: normal; color: #64748b; margin-left: 4px;">(範囲内)</span>';
            } else {
              priceDisplay = (item.price || 0).toLocaleString() + '円';
              badgeText = '<span style="font-size: 10px; font-weight: normal; color: #dc2626; margin-left: 4px;">(正解)</span>';
            }

            const div = document.createElement('div');
            div.className = 'exact-item';
            div.innerHTML = `
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 600; color: #0f172a;">${escapeHtml(item.author || '匿名')}</span>
                <span style="font-weight: 700; color: #dc2626;">${priceDisplay}${badgeText}</span>
              </div>
              <div style="font-size: 11px; color: #64748b; margin-top: 2px;">${escapeHtml(item.text || '')}</div>
            `;
            exactList.appendChild(div);
          });
        }
      }
    }

    function copyScript() {
      const area = document.getElementById('scriptArea');
      const btn = document.getElementById('copyScriptBtn');
      if (area && btn) {
        area.select();
        navigator.clipboard.writeText(area.value);
        const original = btn.textContent;
        btn.textContent = 'コピー完了';
        setTimeout(() => { btn.textContent = original; }, 2000);
      }
    }

    function exportTransparentGraph(btn) {
      const summary = calculatedStats || {};
      const histogram = summary.histogram || [];

      const canvas = document.createElement('canvas');
      canvas.width = 1920;
      canvas.height = 1080;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, 1920, 1080);

      drawRoundedRect(ctx, 80, 80, 700, 140, 16, 'rgba(15, 23, 42, 0.92)');
      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 24px sans-serif';
      ctx.fillText('視聴者による相場予想分布', 116, 130);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 38px sans-serif';
      ctx.fillText('平均予想: ', 116, 185);
      ctx.fillStyle = '#f59e0b';
      ctx.fillText((summary.mean_price || 0).toLocaleString() + ' 円', 290, 185);

      drawRoundedRect(ctx, 1500, 80, 340, 140, 16, 'rgba(15, 23, 42, 0.92)');
      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 22px sans-serif';
      ctx.fillText('総予想回答数', 1530, 130);
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 38px sans-serif';
      ctx.fillText((summary.included_count || 0).toLocaleString() + ' 件', 1530, 185);

      drawRoundedRect(ctx, 80, 260, 1760, 740, 24, 'rgba(15, 23, 42, 0.94)');

      if (histogram.length > 0) {
        const maxCount = Math.max(...histogram.map(h => h.count), 1);
        const barAreaX = 140;
        const barAreaY = 320;
        const barAreaW = 1640;
        const barAreaH = 620;
        const barCount = Math.min(histogram.length, 10);
        const rowHeight = barAreaH / barCount;

        histogram.slice(0, 10).forEach((item, idx) => {
          const y = barAreaY + idx * rowHeight;
          const barW = Math.max(10, (item.count / maxCount) * (barAreaW - 400));

          ctx.fillStyle = '#e2e8f0';
          ctx.font = 'bold 22px monospace';
          ctx.textAlign = 'right';
          ctx.fillText(item.label, barAreaX + 220, y + rowHeight * 0.65);

          drawRoundedRect(ctx, barAreaX + 250, y + 10, barAreaW - 450, rowHeight - 20, 6, 'rgba(255,255,255,0.08)');
          drawRoundedRect(ctx, barAreaX + 250, y + 10, barW, rowHeight - 20, 6, '#38bdf8');

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 22px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(item.count + ' 名 (' + item.percentage + '%)', barAreaX + 265 + barW, y + rowHeight * 0.65);
        });
      }

      downloadCanvas(canvas, 'youtube_price_chart_1080p.png');
      showDownloadFeedback(btn);
    }

    function setText(id, txt) {
      const elem = document.getElementById(id);
      if (elem) elem.textContent = txt;
    }
    function getVal(id) {
      const elem = document.getElementById(id);
      return elem ? elem.value : '';
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function drawRoundedRect(ctx, x, y, width, height, radius, fillStyle) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }
    function downloadCanvas(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    function showDownloadFeedback(btn) {
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = '保存完了';
      setTimeout(() => { btn.textContent = original; }, 2000);
    }
  </script>
